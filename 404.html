<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜よもぎ蒸し/脱毛サロン colore（コロレ）</title>
<!--
  「ページが見つかりません」ページ（404）。2026/10/21 決定事項 08。
  Cloudflare が、無い住所のときにこのファイルを「404」の印のまま返す（wrangler.jsonc の assets.not_found_handling = "404-page"）。
  色・文字・ロゴはトップ（index.html）と同じ。動きは付けない。外に貼るリンクは # を使わない（/menu は転送で /#menu へ）。
-->
<link rel="icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Shippori+Mincho+B1:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#24342b;
  --gold:#c4a466;
  --gold-soft:#e2cf9f;
  --pink:#fe97b2;
  --pink-deep:#ef6386;
  --pink-pale:#fdeef2;
  --cream:#faf5ee;
  --ink:#3a3330;
  --stone:#75695f;
  --line-light:#e6dccd;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans CJK JP",sans-serif;
  --latin:"Cormorant Garamond","Shippori Mincho B1",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:2;letter-spacing:.06em;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:4px}
/* 上の帯：トップと同じ濃い緑にロゴ */
.top{background:var(--forest);padding:14px 20px}
.brand{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;text-decoration:none;width:-webkit-fit-content;width:fit-content;margin:0 auto}
.brand img{width:46px;height:46px;border-radius:10px;margin-right:12px}
.brand span{font-size:.78rem;letter-spacing:.2em;color:var(--gold-soft)}
/* まん中の箱 */
.wrap{max-width:560px;margin:0 auto;padding:48px 20px 64px;text-align:center}
.mark{font-family:var(--latin);font-style:italic;font-size:2.4rem;color:var(--pink-deep);line-height:1;letter-spacing:.1em}
h1{font-family:var(--mincho);font-weight:500;font-size:1.35rem;line-height:1.8;margin:10px 0 16px}
p{margin:0 0 1.2em;color:var(--stone);font-size:.95rem}
.btns{margin-top:22px}
.btn{display:-webkit-inline-box;display:-webkit-inline-flex;display:inline-flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;text-decoration:none;font-weight:500;letter-spacing:.12em;padding:.95em 1.8em;border-radius:999px;line-height:1.4;text-align:center;width:100%;max-width:320px;margin:0 auto 12px}
.btn-pink{background:var(--pink);color:#fff}
.btn-ghost{border:1px solid var(--ink);color:var(--ink);background:transparent}
.btn-line{background:#06c755;color:#fff}
.tel-box{margin-top:26px;padding-top:22px;border-top:1px solid var(--line-light);font-size:.9rem;color:var(--stone)}
.tel{display:block;font-family:var(--latin);font-size:1.9rem;letter-spacing:.06em;text-decoration:none;color:var(--ink);line-height:1.3;margin-top:4px}
.tel-box small{display:block;font-size:.8rem;margin-top:4px}
footer{text-align:center;font-size:.75rem;color:var(--stone);padding:0 20px 32px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="top">
  <a href="/" class="brand" aria-label="colore トップへ"><img src="/images/logo-pink.png" alt="colore" width="46" height="46"><span>よもぎ蒸し・脱毛サロン</span></a>
</div>
<main class="wrap">
  <div class="mark" aria-hidden="true">404</div>
  <h1>お探しの<wbr>ページが<wbr>見つかりませんでした</h1>
  <p>住所が<wbr>変わったか、<wbr>入力が<wbr>まちがっているかもしれません。</p>
  <div class="btns">
    <a class="btn btn-pink" href="/">トップへ戻る</a>
    <a class="btn btn-ghost" href="/menu">メニューを<wbr>見る</a>
    <a class="btn btn-line" href="https://lin.ee/nDeKjiW" target="_blank" rel="noopener">LINE で<wbr>相談</a>
  </div>
  <div class="tel-box">
    お電話での<wbr>ご相談
    <a class="tel" href="tel:08074744035">080-7474-4035</a>
    <small>施術中は<wbr>出られない<wbr>ことがあります。<wbr>LINE も<wbr>ご利用ください。</small>
  </div>
</main>
<footer>よもぎ蒸し/脱毛サロン colore<wbr>（コロレ）<wbr>　山口県防府市</footer>
</body>
</html>
